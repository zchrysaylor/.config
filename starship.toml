format = "[$all](italic)"

[character]
success_symbol = "[>](bold italic green)"
error_symbol = "[x](bold italic red)"
vimcmd_symbol = "[<](bold italic green)"
vimcmd_visual_symbol = "[❮](bold italic yellow)"
vimcmd_replace_symbol = "[❮](bold italic purple)"
vimcmd_replace_one_symbol = "[❮](bold italic purple)"

[git_commit]
style = "green bold italic"
tag_symbol = " tag "

[git_status]
style = "red bold italic"
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

