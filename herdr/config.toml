onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "off"

[terminal]
# Match tmux's pane/window behavior by starting new terminals in the focused cwd.
new_cwd = "follow"

[keys]
goto = "prefix+g"
settings = "prefix+s"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
rename_tab = "prefix+comma"
focus_pane_down = "prefix+j"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"
focus_pane_up = "prefix+k"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"

[[keys.command]]
key = "prefix+shift+M"
type = "popup"
command = "nvim ~/Documents/geumgo/000-scratch/modu-dh.md"
description = "open modu-dh.md"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+m"
type = "popup"
command = "nvim ~/Documents/geumgo/000-scratch/modu.md"
description = "open modu.md"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = '~/.config/scripts/herdr-sessionator.sh "$HOME/.config" ".config"'

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/scripts/herdr-sessionator.sh"
description = "fuzzy-pick workspace directory"
width = "60%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = '~/.config/scripts/herdr-sessionator.sh "$HOME/Documents/geumgo" "geumgo"'

[[keys.command]]
key = "prefix+shift+w"
type = "shell"
command = '~/.config/scripts/herdr-sessionator.sh "$HOME/Code/IdeaProjects/deliveryhero" "deliveryhero"'

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = '~/.config/scripts/herdr-sessionator.sh "$HOME/Code/IdeaProjects/deliveryhero/log-vendor-order-management-application" "otv2"'

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = '~/.config/scripts/herdr-sessionator.sh "$HOME/Code/verin" "verin"'

[[keys.command]]
key = "prefix+shift+backtick"
type = "shell"
command = '~/.config/scripts/herdr-sessionator.sh "$HOME" "home"'

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "~/.config/scripts/herdr-litellm.sh"

[[keys.command]]
key = "prefix+shift+h"
type = "pane"
command = "hunk diff --watch"

[ui]
mouse_capture = true
show_agent_labels_on_pane_borders = true

[ui.sound]
enabled = false
