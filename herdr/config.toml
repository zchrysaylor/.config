[theme]
name = "terminal"
auto_switch = false

[ui.toast]
delivery = "system"

[terminal]
# Match tmux's pane/window behavior by starting new terminals in the focused cwd.
new_cwd = "follow"

[keys]
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# tmux uses prefix+v for the modu note, so keep Herdr's vertical split available elsewhere.
split_vertical = "prefix+alt+v"

[[keys.command]]
key = "prefix+shift+t"
type = "pane"
command = "nvim ~/Documents/geumgo/000-scratch/modu-dh.md"

[[keys.command]]
key = "prefix+v"
type = "pane"
command = "nvim ~/Documents/geumgo/000-scratch/modu.md"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr workspace create --cwd ~/.config --label .config --focus"

[[keys.command]]
key = "prefix+shift+n"
type = "shell"
command = "herdr workspace create --cwd ~/Documents/geumgo --label geumgo --focus"

[[keys.command]]
key = "prefix+shift+w"
type = "shell"
command = "herdr workspace create --cwd ~/Code/IdeaProjects/deliveryhero --label deliveryhero --focus"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr workspace create --cwd ~/Code/IdeaProjects/deliveryhero/log-vendor-order-management-application --label otv2 --focus"

[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = "herdr workspace create --cwd ~/Code/verin --label verin --focus"

[[keys.command]]
key = "prefix+shift+backtick"
type = "shell"
command = "herdr workspace create --cwd ~ --label home --focus"

[[keys.command]]
key = "prefix+shift+h"
type = "pane"
command = "hunk diff --watch"

[ui]
show_agent_labels_on_pane_borders = true
